# Free personal iPhone edition for AltStore / SideStore: no WidgetKit extension.
# Intended for Apple Account free 7-day sideloading, signed on the user's device.
# Do not add App Group entitlements or embedded provisioning profiles.
name: ATATURKHeritagePersonal
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ATATURKHeritage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ataturkheritage.personalpreview
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "HERITAGE_FREE_PERSONAL"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "ATATÜRK Heritage"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: org.ataturkheritage.personalpreview.entry
            CFBundleURLSchemes: [ataturkheritage]
