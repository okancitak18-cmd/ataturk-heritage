# Draft XcodeGen specification. Must be generated/built and signed on macOS.
# Change PRODUCT_BUNDLE_IDENTIFIER and App Groups for the owner's Apple team.
name: ATATURKHeritage
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ATATURKHeritage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ataturkheritage
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "ATATÜRK Heritage"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.example.ataturkheritage.entry
            CFBundleURLSchemes: [ataturkheritage]
    entitlements:
      path: App/ATATURKHeritage.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ataturkheritage.shared
    dependencies:
      - target: ATATURKHeritageWidgets
  ATATURKHeritageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ataturkheritage.widgets
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "ATATÜRK Heritage Widgets"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ATATURKHeritageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ataturkheritage.shared
